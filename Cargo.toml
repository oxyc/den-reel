[package]
name = "den-reel"
version = "0.31.0"
edition = "2021"
description = "Den trailers, one container: addon (imdb→ytId via TMDB) + yt-dlp/ffmpeg proxy (ytId→faststart MP4) for inline tvOS playback"
publish = false
license = "MIT"

[[bin]]
name = "den-reel"
path = "src/main.rs"

[dependencies]
# Single-threaded async runtime — this is an I/O-bound proxy; the CPU work lives in the
# yt-dlp/ffmpeg subprocesses, not here. current_thread keeps the resident thread count (and RAM)
# minimal on a homelab box.
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
# server-graceful: stop accepting on SIGTERM and let in-flight requests finish (see serve_until).
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not OpenSSL) with bundled webpki roots → no ca-certificates package needed at runtime,
# and a static-friendly TLS stack for a slim image.
# http2: googlevideo speaks it, and a /progressive index is dozens of range requests to one host. Over
# HTTP/1.1 each ran on its own TLS connection, up to sixteen opened at once on this single-threaded runtime,
# and a cold build cost 0.9–3.2 s where the same build on connections already open cost under half a second.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
tokio-util = { version = "0.7", features = ["io"] }
# Only need Shared/FutureExt/TryStreamExt — skip the sink/io/compat machinery in the defaults.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
base64 = "0.23"
# Sealed config-in-URL (docs mirror of den-scout/docs/SEALED-CONFIG.md): decrypt a config sealed to the
# addon's X25519 key. `seal` = libsodium crypto_box_seal (X25519 + XSalsa20-Poly1305, blake2b nonce),
# byte-compatible with the Go addon (den-scout), the Rust addon (den-subtitles), and the browser bundle.
# Decrypt-only here → no rng needed.
crypto_box = { version = "0.9", features = ["seal"] }
# Keyed BLAKE2b for the optional /play + /crop URL signature (PLAY_SECRET), and a constant-time
# compare for checking it. Both are ALREADY in the tree — crypto_box uses blake2 for the seal nonce
# and subtle throughout — so these edges add a direct dependency, not a new crate to compile.
blake2 = "0.10"
subtle = "2"
# HTTP dates for /play's Last-Modified, If-Modified-Since and If-Range. hyper already builds it for
# the Date header, so this too is a direct edge rather than new code.
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "signal", "test-util"] }

# Self-contained binary for a resource-constrained homelab. opt-level 3 (speed) — the size delta
# over "z" is <1 MB but the serve/stream path wants the fast codegen (time-to-first-frame). Fat
# LTO + one codegen unit + strip keep it small anyway. panic=unwind (the default): a panic in one
# request task then unwinds just that connection (tokio catches it) instead of aborting the whole
# server — worth the small unwind-table cost for a long-lived service.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# killpg: kill_on_drop reaps only the direct child, and yt-dlp forks ffmpeg to do the merge.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
