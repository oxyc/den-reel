# Build the den-reel image and push it to GitHub Container Registry.
# The homelab compose pulls ghcr.io/oxyc/den-reel:<tag> (like Frigate/Scrypted), so a code change
# here → new image → `docker compose pull && up -d` on the box. No app release.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-reel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  # On a PR (e.g. an automated yt-dlp bump) — build the image WITHOUT pushing. This is the merge gate:
  # it runs the SHA-verified yt-dlp download + full image assembly, so a bad checksum or broken build
  # fails the check. Single-arch (amd64) for speed: arm64 is emulated and slow, and the PR gate has to
  # return in minutes. The arm64 half is therefore exercised only at RELEASE time (the publish job
  # below), which is the earliest an arm64-specific break — a bad ARM64 checksum, a stage that doesn't
  # cross-build — can surface. Accepted deliberately; the alternative is a multi-hour PR check.
  # Note: this proves the image builds, NOT that YouTube extraction still works (that canary
  # can't run on datacenter IPs) — extraction breakage is caught operationally via /health.
  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: test
    # Publish only on a v* tag (a deliberate release) or a manual run — NOT every main push. `test`
    # still runs on every push/PR; the box updates only when you cut a tag.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The manifest reads env!("CARGO_PKG_VERSION") and the image tag is the git tag — so a v* release
      # must equal v<Cargo.toml version> or the reported version would be a lie. Fail fast on a mismatch.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml=$cargo_v  tag=$GITHUB_REF_NAME"
          test "v$cargo_v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml v$cargo_v — bump Cargo.toml before tagging"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # a v1.2.3 tag → :1.2.3, :1.2, :1, :latest (+ :sha). Publish runs on tags only, so :latest
          # is unconditional — the newest release is what the box's :latest pull gets.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      # arm64 is built under emulation. Every stage compiles from source on the target arch — the Rust
      # binary (fat LTO) and GPAC/MP4Box — so there is nothing to cross-build without reworking the
      # Dockerfile. That makes this job slow (tens of minutes), which is affordable precisely because
      # it runs on a v* tag or a manual dispatch, never on a push or a PR. If it ever becomes the
      # bottleneck, the fix is a per-arch matrix on native runners (ubuntu-24.04-arm) merged with
      # `buildx imagetools create` — more workflow, no emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      # BOTH arches. This job published whatever the runner happened to be (amd64) for its whole
      # existence, while the Dockerfile carried arm64 branches and pinned ARM64 checksums that nothing
      # ever executed — so an arm64 host pulling :latest found no matching manifest at all.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
