name: ci

# Every exact main commit produces a scanned, immutable candidate image while its checks run. A release tag only
# promotes that already-tested digest (docker-publish.yml); it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-reel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  # On a PR (e.g. an automated yt-dlp bump) — build the image WITHOUT pushing. This is the merge gate:
  # it runs the SHA-verified yt-dlp download + full image assembly, so a bad checksum or broken build
  # fails the check. amd64, the only arch the box runs. It reads main's cache but deliberately neither pushes an
  # image nor overwrites the durable release cache with an unmerged revision.
  # Note: this proves the image builds, NOT that YouTube extraction still works (that canary
  # can't run on datacenter IPs) — extraction breakage is caught operationally via /health.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release metadata
        id: source
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image (no push)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.output=type=cacheonly

  # Main builds and scans the immutable candidate while the test job runs. It is intentionally unsigned and never
  # receives :latest here; docker-publish promotes it only after this exact workflow has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            default.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            default.cache-to=type=gha,mode=max,scope=release-image
      - name: Record candidate digest
        id: image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          digest=$(jq -r '.default["containerimage.digest"] // empty' <<<"$METADATA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in the build metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The manifest is served without a TMDB key or a cache, so it proves the image starts and reports the
      # release the VERSION file names.
      - name: Prove the image reports its release version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -p 127.0.0.1:18092:8092 "$IMAGE@$DIGEST")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18092/manifest.json 2>/dev/null) && break
            sleep 1
          done
          got=$(jq -r .version <<<"$body")
          test "$got" = "$VERSION" || { echo "::error::image /manifest.json version is '$got', expected $VERSION"; exit 1; }
          curl -fsS http://127.0.0.1:18092/health | jq -e '.status' >/dev/null
      # One scan, of fixable HIGH and CRITICAL findings, which the report and the gate below both read.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: a CRITICAL with a fixed version available fails here, before the digest is recorded, so no tag can
      # promote it. Unfixed CVEs are ignored. A finding that does not apply goes in .trivyignore with a reason.
      - name: Scan gate
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n --arg image "$DIGEST" '{image: $image}' > candidate-digest.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digest.json
          if-no-files-found: error
          retention-days: 30
      # Report: advisory, it never fails the job.
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # A code-scanning outage must not hold a release.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
